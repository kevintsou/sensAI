# sensAI 規則庫
#
# 這裡放的是「這個專案的硬體特性與團隊慣例」—— AI 不可能自己知道的東西。
# 沒有規則的話，審查結果會退化成任何通用工具都給得出的泛泛意見。
#
# 由開發者透過版本控管維護。使用者只能在自己機器上靜音，不修改這個檔案。
#
# 每條規則：
#   id        必填，唯一
#   languages [c] / [asm] / [c, asm]，省略代表兩種都適用
#   severity  error / warning / info，預設 warning
#   rule      必填，自然語言，直接寫給模型看
#   except    什麼情況不算問題 —— 團隊層級的例外放這裡
#   examples  一組正反範例。不要省略，對準確度的幫助遠大於把 rule 寫更長。
#
# 暫存器用途與呼叫慣例這類「架構事實」不用寫在這裡，擴充會自動注入
# （見 src/abi.ts，架構由 .sensai/config.yaml 的 assembly.arch 指定）。
#
# 以下是範例，請換成你們專案真正的規則。

# ---------------------------------------------------------------- C

- id: dma-cache-maintenance
  languages: [c]
  severity: error
  rule: |
    本專案 SoC 的 D-cache 是 write-back。DMA buffer 在啟動 DMA 前必須先 clean
    （CPU 寫、DMA 讀的方向），或在讀取 DMA 結果前先 invalidate（DMA 寫、CPU 讀的方向）。
    要呼叫 dma_cache_clean() / dma_cache_invalidate()，只下 __DSB() 是不夠的 ——
    DSB 只保證存取順序，不會把資料推出 cache。
  examples:
    bad: |
      memcpy(tx_buf, data, len);
      dma_start(DMA_CH0, tx_buf, len);
    good: |
      memcpy(tx_buf, data, len);
      dma_cache_clean(tx_buf, len);
      dma_start(DMA_CH0, tx_buf, len);

- id: volatile-shared-state
  languages: [c]
  severity: error
  rule: |
    被 ISR 與主程式同時存取的變數必須標 volatile，否則編譯器會把讀取
    提到迴圈外或直接快取在暫存器裡，導致主程式看不到 ISR 的更新。
  except: |
    命名以 _isr 結尾的變數是 ISR 專用副本，不算共享，不要報。
    ring buffer 的 head 與 tail 各自只有單一 writer，也不算共享。
  examples:
    bad: |
      static uint32_t rx_ready;
      void UART0_IRQHandler(void) { rx_ready = 1; }
      void main_loop(void) { while (!rx_ready) { } }
    good: |
      static volatile uint32_t rx_ready;
      void UART0_IRQHandler(void) { rx_ready = 1; }
      void main_loop(void) { while (!rx_ready) { } }

- id: w1c-status-bits
  languages: [c, asm]
  severity: error
  rule: |
    狀態暫存器裡的中斷旗標多半是 write-1-clear：寫 1 才是清除，寫 0 沒有作用。
    用讀出後再寫回的方式（C 的 |=，組語的 load / or / store）去清一個 W1C 位元，
    實際上是把讀回來的所有已設旗標又寫回去，會把其他還沒處理的中斷一併清掉。
    清除單一旗標要直接寫值，不要 read-modify-write。
  examples:
    bad: |
      UART0->STATUS |= UART_STATUS_TXDONE;
    good: |
      UART0->STATUS = UART_STATUS_TXDONE;

- id: isr-non-reentrant
  languages: [c]
  severity: error
  rule: |
    ISR 裡不可以呼叫非 reentrant 或會阻塞的函式，包括 malloc、free、printf、
    sprintf，以及任何會等待旗號或迴圈等待硬體的函式。ISR 應該只設一個旗標或
    丟進佇列，實際工作留給主迴圈。
  examples:
    bad: |
      void TIMER0_IRQHandler(void) {
          char *msg = malloc(32);
          sprintf(msg, "tick %lu", tick_count);
      }
    good: |
      void TIMER0_IRQHandler(void) {
          tick_pending = 1;
      }

- id: rmw-critical-section
  languages: [c]
  severity: warning
  rule: |
    對 ISR 也會改動的共享變數或硬體暫存器做 read-modify-write（|=、&=、++）時，
    必須關中斷或使用不可分割的操作。中斷落在讀跟寫之間的話，ISR 的更新會被覆蓋掉。
  except: |
    只有主程式會寫、ISR 只讀的變數不需要保護。
    已經在 ISR 內部、且該 ISR 不會被同優先權中斷搶佔的情況也不需要。
  examples:
    bad: |
      pending_events |= EVENT_RX;
    good: |
      uint32_t primask = __get_PRIMASK();
      __disable_irq();
      pending_events |= EVENT_RX;
      __set_PRIMASK(primask);

- id: delay-loop-optimized-away
  languages: [c]
  severity: warning
  rule: |
    用空迴圈做延遲會在 -O2 下被整個優化掉。硬體要求的等待時間必須用
    delay_us() 這類有實際副作用的函式，或在迴圈裡讀取 volatile 變數。
  examples:
    bad: |
      for (int i = 0; i < 1000; i++) { }
      PLL->CTRL |= PLL_ENABLE;
    good: |
      delay_us(10);
      PLL->CTRL |= PLL_ENABLE;

- id: unaligned-widening-cast
  languages: [c]
  severity: error
  rule: |
    把對齊保證較弱的指標轉型成較寬的型別再解參考，位址不保證符合新型別的
    對齊要求。典型來源是 uint8_t* / char* / void* 的緩衝區 —— DMA buffer、
    封包 payload、ring buffer、從外部傳進來的位址 —— 轉成 uint32_t* 或
    uint16_t* 或結構指標之後直接讀寫。編譯器會「相信」轉型後的型別，
    據此挑選指令，所以問題不會在編譯期被擋下來。

    位址是編譯期常數的時候要特別注意，因為對齊可以直接算出來，不必臆測：
    常數位址對型別大小取餘數不為零，就是確定的錯誤，不是「可能有問題」。
    例如 *(uint32_t *)0x0003 —— 0x0003 % 4 = 3，這個存取一定不對齊。
    這類寫法最常見的形式是暫存器位址的巨集，位移量打錯一個字就成立：

        #define UART_STATUS (*(volatile uint32_t *)0x40001003)

    回報這種案例時把餘數算出來寫進 evidence，不要用「可能未對齊」帶過 ——
    講得出確定的算式，作者才不會把它當成又一則模稜兩可的建議。

    本專案的兩個目標架構表現不同，但都不安全：

    AndeStar V5（RISC-V）未對齊的 load/store 可能直接觸發 misaligned
    exception；就算平台裝了 trap handler 去模擬，一次存取也要數十到數百個
    週期，落在 ISR 裡會直接毀掉中斷延遲。

    ARMv7E-M 對 Normal memory 的單筆 LDR/STR 多半能完成，所以「在 ARM 上
    測起來沒事」不能當作沒問題的證據 —— LDM/STM/LDRD/STRD 與 exclusive
    存取不論如何都會 fault，而編譯器有可能把結構複製或連續存取合併成
    這些指令。CCR.UNALIGN_TRP 打開時連單筆存取也會 fault。

    對 MMIO 位址則兩個架構都一樣：未對齊存取一律不合法。

    正解是用 memcpy 搬進一個正確型別的區域變數（編譯器在對齊已知時會把它
    優化掉），或逐位元組組合，不要靠轉型。
  except: |
    直接宣告的變數、陣列與結構成員由編譯器保證對齊，一般的存取不算問題，
    不要報。
    逐位元組（uint8_t / char）的存取沒有對齊需求，不算問題。
    已經用 memcpy、逐位元組組合，或編譯器的 packed 屬性處理的寫法就是正解，
    不要報。
    轉型前已經檢查或斷言過對齊（例如 ((uintptr_t)p & 3) == 0）的，不算問題。
  examples:
    bad: |
      /* payload 指向 DMA 收到的位元組流，只保證 1-byte 對齊 */
      uint32_t read_seq(const uint8_t *payload)
      {
          return *(const uint32_t *)(payload + 3);
      }
    good: |
      uint32_t read_seq(const uint8_t *payload)
      {
          uint32_t seq;
          memcpy(&seq, payload + 3, sizeof seq);
          return seq;
      }

- id: hw-poll-without-timeout
  languages: [c]
  severity: error
  rule: |
    輪詢硬體狀態位元的迴圈必須有逃生路徑。硬體不回應的原因很多 —— 時脈沒開、
    電源域沒上電、外設卡在錯誤狀態、板子上那顆晶片就是壞了 —— 而沒有上限的
    while 迴圈碰到這些情況會讓整台機器停住，連 watchdog 都可能餵不到。

    這類迴圈在桌上測試時永遠會過，因為硬體是好的。它只在現場、只在特定板子、
    只在特定上電順序下才卡住，而且卡住的時候沒有任何訊息，最難查。

    逃生路徑可以是固定的重試次數上限，或是跟系統 tick 比較的 deadline。
    重點是超時之後要能回報失敗讓呼叫端處理，不是靜靜地繼續往下走。

    註：本專案目前沒有共用的 timeout helper，下面的正確範例用計數上限示範。
    團隊之後若有統一的等待函式，把這條規則的範例換成那個函式，準確度會更好。
  except: |
    等待的是同一顆核心上的軟體旗標（例如另一段程式碼會設定的變數），
    不是硬體狀態，不適用這條規則。
    迴圈本身已經有次數上限、deadline 比較，或迴圈內有餵 watchdog 的，
    不算問題。
    for 迴圈跑固定次數這種本來就有界的寫法不算問題。
  examples:
    bad: |
      void uart_send_byte(uint8_t b)
      {
          while (!(UART0->STATUS & UART_STATUS_TXDONE)) {
          }
          UART0->DATA = b;
      }
    good: |
      int uart_send_byte(uint8_t b)
      {
          uint32_t spins = UART_TX_MAX_SPINS;
          while (!(UART0->STATUS & UART_STATUS_TXDONE)) {
              if (--spins == 0) {
                  return -1;
              }
          }
          UART0->DATA = b;
          return 0;
      }

- id: stack-address-escape
  languages: [c]
  severity: error
  rule: |
    把區域變數或區域陣列的位址交給生命週期比這個函式更長的東西，函式返回之後
    那塊堆疊會被下一次呼叫或中斷覆寫，對方拿到的是垃圾。常見的交出方式包括
    存進全域指標、放進佇列或 descriptor、註冊成 callback 的參數，以及交給 DMA。

    DMA 是最危險的一種，因為 dma_start() 這類介面是非同步的：函式返回時搬移
    才剛開始，來源緩衝區的堆疊框架已經歸還。症狀是偶爾送出正確資料、偶爾送出
    上一個函式留下的殘骸，跟時序有關，重現不了。

    這類錯誤編譯器多半不會警告，因為位址的傳遞在型別上完全合法。
  except: |
    在函式返回前一定用完的同步用法不算問題 —— 例如把區域緩衝區的位址傳給一個
    會在返回前處理完的函式。
    static 或全域宣告的緩衝區不受這條規則限制，它們的生命週期夠長。
  examples:
    bad: |
      void send_status(void)
      {
          uint8_t frame[8];
          build_frame(frame);
          dma_start(DMA_CH0, frame, sizeof frame);   /* DMA 還在搬，函式已返回 */
      }
    good: |
      static uint8_t frame[8];

      void send_status(void)
      {
          build_frame(frame);
          dma_cache_clean(frame, sizeof frame);
          dma_start(DMA_CH0, frame, sizeof frame);
      }
